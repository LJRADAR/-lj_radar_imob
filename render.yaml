services:
  - type: web
    name: lji-source-router
    runtime: node
    rootDir: services/source-router
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LJI_SOURCE_ROUTER_TOKEN
        generateValue: true
      - key: MERCADOLIVRE_ACCESS_TOKEN
        sync: false
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: SOURCE_REQUEST_TIMEOUT_MS
        value: "9000"

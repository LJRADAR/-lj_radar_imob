name: Package current version

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'services/**'
      - 'supabase/**'
      - 'render.yaml'
      - '.github/workflows/package-current-version.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          zip -r LJ_Radar_Imob_v29.1_Central_Captacao.zip frontend services supabase render.yaml README.md -x '*.git*'
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LJ_Radar_Imob_v29.1_Central_Captacao
          path: LJ_Radar_Imob_v29.1_Central_Captacao.zip
          retention-days: 7

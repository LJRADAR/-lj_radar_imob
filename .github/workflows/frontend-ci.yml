name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find frontend -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
      - name: Upload Cloudflare deploy package
        uses: actions/upload-artifact@v4
        with:
          name: LJ-Radar-Imob-Cloudflare
          path: frontend/
          if-no-files-found: error
          retention-days: 30

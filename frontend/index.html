<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>LJ Radar Imob</title>
<style>html,body{margin:0;min-height:100%;background:#fff}body{font-family:Arial,sans-serif}.lji-boot{position:fixed;inset:0;display:grid;place-items:center;color:#0a2a7a;background:#fff;font:600 14px Arial,sans-serif;letter-spacing:.04em}</style>
</head>
<body>
<div class="lji-boot">Carregando LJ Radar Imob…</div>
<script>
(async function boot(){
  try{
    const response = await fetch('./app-shell-v22.50.4.html?boot=20260909-1', {cache:'no-store'});
    if(!response.ok) throw new Error('shell_http_'+response.status);
    let html = await response.text();

    // Identificação inequívoca do pacote corrigido no Cloudflare.
    html = html.replaceAll('?v=22.50.4','?v=26.1.0');
    html = html.replace('v22.50.4 · Filtros de Qualidade','v26.1.0 · Desktop + Mobile');
    html = html.replace('LJ Radar Imob v22.50.4 · © 2026','LJ Radar Imob v26.1.0 · © 2026');
    html = html.replace('<!-- BUILD: LJ Radar Imob v22.50.4 · Central de Ação Filtrada · 04/09/2026 -->','<!-- BUILD: LJ Radar Imob v26.1.0 · Cloudflare deterministic boot · 09/09/2026 -->');

    // Cloudflare: carrega os estilos aprovados de forma estática, sem depender
    // apenas dos scripts dinâmicos disparados por lji-config.js durante o parser.
    const approvedHead = `
<link rel="stylesheet" href="./desktop-layout-v23.css?v=20260909-1" data-lji-cf-desktop>
<link rel="stylesheet" href="./desktop-layout-v23-hotfix.css?v=20260909-1" data-lji-cf-desktop-hotfix>
<link rel="stylesheet" href="./desktop-login-polish-v23.css?v=20260909-1" data-lji-cf-login-polish>
<link rel="stylesheet" href="./dashboard-v24.css?v=20260909-1" data-lji-cf-dashboard>
<link rel="stylesheet" href="./mobile-v25.css?v=20260909-1" media="(max-width: 900px)" data-lji-cf-mobile>`;
    html = html.replace('</head>', approvedHead + '\n</head>');

    // O app-auth monta o overlay no final do shell. Estes scripts entram depois
    // dele, garantindo que o layout aprovado encontre o login já existente.
    const approvedTail = `
<script src="./desktop-layout-v23.js?v=20260909-1" data-lji-cf-desktop><\/script>
<script src="./desktop-logo-v23.js?v=20260909-1" data-lji-cf-logo><\/script>
<script src="./desktop-login-polish-v23.js?v=20260909-1" data-lji-cf-polish><\/script>
<script src="./dashboard-v24.js?v=20260909-1" data-lji-cf-dashboard><\/script>
<script src="./mobile-v25.js?v=20260909-1" data-lji-cf-mobile><\/script>`;
    html = html.replace('</body>', approvedTail + '\n</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('LJ Radar boot failed', error);
    document.body.innerHTML = '<div class="lji-boot">Não foi possível carregar o LJ Radar. Atualize a página.</div>';
  }
})();
</script>
</body>
</html>

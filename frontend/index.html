<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>LJ Radar Imob</title>
<style>html,body{margin:0;min-height:100%;background:#fff}body{font-family:Arial,sans-serif}.lji-boot{position:fixed;inset:0;display:grid;place-items:center;color:#0a2a7a;background:#fff;font:600 14px Arial,sans-serif;letter-spacing:.04em}</style>
</head>
<body>
<div class="lji-boot">Carregando LJ Radar Imob…</div>
<script>
(async function boot(){
  try{
    const response = await fetch('./app-shell-v22.50.4.html?boot=20260908-2', {cache:'no-store'});
    if(!response.ok) throw new Error('shell_http_'+response.status);
    let html = await response.text();
    html = html.replaceAll('?v=22.50.4','?v=23.0.3');
    html = html.replace('v22.50.4 · Filtros de Qualidade','v23.0.3 · Desktop');
    html = html.replace('LJ Radar Imob v22.50.4 · © 2026','LJ Radar Imob v23.0.3 · © 2026');
    html = html.replace('<!-- BUILD: LJ Radar Imob v22.50.4 · Central de Ação Filtrada · 04/09/2026 -->','<!-- BUILD: LJ Radar Imob v23.0.3 · Desktop aprovado · 08/09/2026 -->');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('LJ Radar boot failed', error);
    document.body.innerHTML = '<div class="lji-boot">Não foi possível carregar o LJ Radar. Atualize a página.</div>';
  }
})();
</script>
</body>
</html>
